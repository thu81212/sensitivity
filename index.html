<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noise Sensitivity</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        #noise-strip {
            width: 90%;
            height: 40vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .bar {
            width: 16px;
            height: 70%;
            background: #d0d0d0;
            transition: background-color 0.05s ease-out, height 0.05s ease-out;
        }
    </style>
</head>
<body>
    <div id="noise-strip"></div>

    <script>
        // Configuration
        const NUM_BARS = 50;
        const BASE_HEIGHT = 40; // percentage
        const MAX_HEIGHT = 95; // percentage

        // Audio variables
        let audioContext;
        let analyser;
        let dataArray;
        let source;
        let currentNoiseLevel = 0;
        let isMicActive = false;
        let animationFrame = 0;

        // Create bars with random properties
        const strip = document.getElementById('noise-strip');
        const bars = [];
        const barRandomness = []; // Store random characteristics for each bar

        for (let i = 0; i < NUM_BARS; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            strip.appendChild(bar);
            bars.push(bar);

            // Each bar gets unique random properties
            barRandomness.push({
                heightOffset: Math.random() * 0.3 + 0.85, // 0.85-1.15 multiplier
                sensitivityOffset: Math.random() * 0.5 + 0.75, // 0.75-1.25 multiplier
                phaseOffset: Math.random() * Math.PI * 2, // Random phase for animation
                flickerSpeed: Math.random() * 0.02 + 0.01 // Random animation speed
            });
        }

        // Calculate static gradient (darker in center, lighter on sides)
        function getStaticGrayValue(index) {
            const center = NUM_BARS / 2;
            const distanceFromCenter = Math.abs(index - center);
            const normalizedDistance = distanceFromCenter / center;

            // Create cloud effect: darker in center, lighter on edges
            const intensity = 1 - Math.pow(normalizedDistance, 1.5);

            // Map to gray values (lighter gray range for static look)
            const minGray = 200; // light gray
            const maxGray = 100; // darker gray
            const grayValue = minGray - (intensity * (minGray - maxGray));

            return Math.round(grayValue);
        }

        // Set initial static appearance
        bars.forEach((bar, i) => {
            const gray = getStaticGrayValue(i);
            bar.style.backgroundColor = `rgb(${gray}, ${gray}, ${gray})`;
        });

        // Initialize microphone
        async function initMicrophone() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;

                source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);

                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);

                isMicActive = true;
                animate();
            } catch (err) {
                console.log('Microphone access denied or unavailable:', err);
                // Keep static design if mic permission denied
                isMicActive = false;
            }
        }

        // Calculate current noise level from microphone
        function getNoiseLevel() {
            if (!analyser) return 0;

            analyser.getByteFrequencyData(dataArray);

            // Calculate RMS (root mean square) for overall volume
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i] * dataArray[i];
            }
            const rms = Math.sqrt(sum / dataArray.length);

            // Normalize to 0-1 range
            return rms / 255;
        }

        // Update bars based on noise level
        function updateBars(noiseLevel) {
            animationFrame++;

            bars.forEach((bar, i) => {
                const center = NUM_BARS / 2;
                const distanceFromCenter = Math.abs(i - center);
                const normalizedDistance = distanceFromCenter / center;

                // Center bars are more affected by noise
                const centerIntensity = 1 - Math.pow(normalizedDistance, 1.5);

                // Get this bar's unique random properties
                const random = barRandomness[i];

                // Add organic wave motion with random phase
                const waveMotion = Math.sin(animationFrame * random.flickerSpeed + random.phaseOffset);
                const waveMotion2 = Math.sin(animationFrame * random.flickerSpeed * 0.7 + random.phaseOffset * 1.3);

                // Calculate gray value with randomness
                const staticGray = getStaticGrayValue(i);

                // More dramatic darkening with random variations
                const noiseDarkening = noiseLevel * centerIntensity * random.sensitivityOffset * 120;
                const randomDarkVariation = waveMotion * 15 * noiseLevel;
                const newGray = Math.max(30, staticGray - noiseDarkening + randomDarkVariation);

                // Much bigger height variations with randomness
                const baseHeightIncrease = noiseLevel * centerIntensity * (MAX_HEIGHT - BASE_HEIGHT);
                const randomHeightVariation = waveMotion * 15 * noiseLevel + waveMotion2 * 10 * noiseLevel;
                const individualRandomHeight = random.heightOffset;

                let newHeight = (BASE_HEIGHT + baseHeightIncrease) * individualRandomHeight + randomHeightVariation;

                // Add more dramatic random spikes
                if (Math.random() < noiseLevel * 0.3) {
                    newHeight += Math.random() * 20 * noiseLevel;
                }

                // Clamp height
                newHeight = Math.max(20, Math.min(MAX_HEIGHT, newHeight));

                bar.style.backgroundColor = `rgb(${newGray}, ${newGray}, ${newGray})`;
                bar.style.height = `${newHeight}%`;
            });
        }

        // Animation loop
        function animate() {
            if (!isMicActive) return;

            const rawNoiseLevel = getNoiseLevel();

            // Less smoothing for more responsive, dynamic feel
            currentNoiseLevel = currentNoiseLevel * 0.6 + rawNoiseLevel * 0.4;

            // Amplify the noise level for bigger visual effect
            const amplifiedNoise = Math.min(1, currentNoiseLevel * 1.5);

            updateBars(amplifiedNoise);

            requestAnimationFrame(animate);
        }

        // Start microphone on user interaction (required by browsers)
        document.addEventListener('click', () => {
            if (!isMicActive && !audioContext) {
                initMicrophone();
            }
        });

        // Auto-start attempt (may require user gesture in some browsers)
        initMicrophone();
    </script>
</body>
</html>
