<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noise Sensitivity</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        #noise-strip {
            width: 90%;
            height: 40vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .bar {
            width: 8px;
            height: 70%;
            background: #d0d0d0;
            transition: background-color 0.1s ease, height 0.1s ease;
        }
    </style>
</head>
<body>
    <div id="noise-strip"></div>

    <script>
        // Configuration
        const NUM_BARS = 50;
        const BASE_HEIGHT = 70; // percentage
        const MAX_HEIGHT = 90; // percentage

        // Audio variables
        let audioContext;
        let analyser;
        let dataArray;
        let source;
        let currentNoiseLevel = 0;
        let isMicActive = false;

        // Create bars
        const strip = document.getElementById('noise-strip');
        const bars = [];

        for (let i = 0; i < NUM_BARS; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            strip.appendChild(bar);
            bars.push(bar);
        }

        // Calculate static gradient (darker in center, lighter on sides)
        function getStaticGrayValue(index) {
            const center = NUM_BARS / 2;
            const distanceFromCenter = Math.abs(index - center);
            const normalizedDistance = distanceFromCenter / center;

            // Create cloud effect: darker in center, lighter on edges
            const intensity = 1 - Math.pow(normalizedDistance, 1.5);

            // Map to gray values (lighter gray range for static look)
            const minGray = 200; // light gray
            const maxGray = 100; // darker gray
            const grayValue = minGray - (intensity * (minGray - maxGray));

            return Math.round(grayValue);
        }

        // Set initial static appearance
        bars.forEach((bar, i) => {
            const gray = getStaticGrayValue(i);
            bar.style.backgroundColor = `rgb(${gray}, ${gray}, ${gray})`;
        });

        // Initialize microphone
        async function initMicrophone() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;

                source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);

                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);

                isMicActive = true;
                animate();
            } catch (err) {
                console.log('Microphone access denied or unavailable:', err);
                // Keep static design if mic permission denied
                isMicActive = false;
            }
        }

        // Calculate current noise level from microphone
        function getNoiseLevel() {
            if (!analyser) return 0;

            analyser.getByteFrequencyData(dataArray);

            // Calculate RMS (root mean square) for overall volume
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i] * dataArray[i];
            }
            const rms = Math.sqrt(sum / dataArray.length);

            // Normalize to 0-1 range
            return rms / 255;
        }

        // Update bars based on noise level
        function updateBars(noiseLevel) {
            bars.forEach((bar, i) => {
                const center = NUM_BARS / 2;
                const distanceFromCenter = Math.abs(i - center);
                const normalizedDistance = distanceFromCenter / center;

                // Center bars are more affected by noise
                const centerIntensity = 1 - Math.pow(normalizedDistance, 1.5);

                // Calculate gray value
                const staticGray = getStaticGrayValue(i);

                // Add noise effect: darker and taller in center when noise increases
                const noiseDarkening = noiseLevel * centerIntensity * 80;
                const newGray = Math.max(40, staticGray - noiseDarkening);

                // Height increases with noise in center
                const heightIncrease = noiseLevel * centerIntensity * (MAX_HEIGHT - BASE_HEIGHT);
                const newHeight = BASE_HEIGHT + heightIncrease;

                bar.style.backgroundColor = `rgb(${newGray}, ${newGray}, ${newGray})`;
                bar.style.height = `${newHeight}%`;
            });
        }

        // Animation loop
        function animate() {
            if (!isMicActive) return;

            currentNoiseLevel = getNoiseLevel();

            // Smooth the noise level
            currentNoiseLevel = currentNoiseLevel * 0.3 + currentNoiseLevel * 0.7;

            updateBars(currentNoiseLevel);

            requestAnimationFrame(animate);
        }

        // Start microphone on user interaction (required by browsers)
        document.addEventListener('click', () => {
            if (!isMicActive && !audioContext) {
                initMicrophone();
            }
        });

        // Auto-start attempt (may require user gesture in some browsers)
        initMicrophone();
    </script>
</body>
</html>
